[package]
name = "hightorrent_resolve"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
env_logger = "0.11.8"
# Opting for git until release with MagnetLink: Display
#hightorrent = "0.3.2"
hightorrent = { git = "https://github.com/angrynode/hightorrent" }
# librqbit = "8.1.1"
librqbit = { path = "../rqbit/crates/librqbit" }
log = "0.4.28"
temp-dir = "0.1.16"
tokio = { version = "1.48.0", features = ["net", "rt", "macros"] }
